name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Only the Helm job's chart-testing uses this; the build job gets its Python
  # from .python-version through uv.
  # renovate: datasource=docker depName=python
  PYTHON_VERSION: "3.14"
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.12.23"
  REGISTRY_IMAGE: clarkperkins/saucerbot

# Default every job down to read-only on the repo contents; the two jobs that
# need more (Build & Test, Helm Chart) declare it themselves below. The docker
# jobs authenticate to the registry with DOCKERHUB_TOKEN rather than
# GITHUB_TOKEN, and same-run artifact up/download uses the Actions runtime
# token, so none of them need anything beyond this.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test

    # Dependabot-triggered runs get a read-only token by default, which makes
    # the test reporter's check-run creation 403. Naming any permission drops
    # the rest to none, so everything this job needs is listed.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --locked

      - name: Run Checks
        run: |
          make check
        env:
          DJANGO_ENV: test

      # "all" means one container per PostgreSQL major from Django's own
      # minimum_database_version up to POSTGRES_CEILING in tests/conftest.py,
      # so the whole supported range is covered by this one step. A plain run
      # without it would only cover POSTGRES_DEFAULT, which is the right
      # default locally but would leave the rest of the range untested here.
      # The runner's docker daemon is all this needs.
      - name: Run Tests
        run: |
          make test
        env:
          DJANGO_ENV: test
          TEST_POSTGRES_MAJORS: all

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/tests/*.xml

  docker-meta:
    name: Docker Meta

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
      # Runs triggered by Dependabot are treated like fork PRs: no Actions
      # secrets, so DOCKERHUB_TOKEN is empty and every registry step fails on
      # "Password required". Still build the image to prove it builds, but
      # skip logging in, pushing and the manifest. The push happens on the
      # main run after merge, where the secret exists. github.actor is the
      # right field -- it stays dependabot[bot] when a human re-runs the
      # workflow, and that is what actually gates secret access.
      push: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,enable={{is_default_branch}},value=latest
            type=raw,enable={{is_default_branch}},value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}

  docker:
    name: Docker Build (${{ matrix.platform }})

    needs:
      - docker-meta

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: needs.docker-meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: clarkperkins
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hardened Images
        if: needs.docker-meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: clarkperkins
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push by Digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-meta.outputs.labels }}
          # push-by-digest only means anything when pushing, so fall back to
          # cacheonly rather than push=false: the image still builds, nothing
          # touches the registry.
          outputs: ${{ needs.docker-meta.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || 'type=cacheonly' }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          # Writing the cache needs a login; reading it does not.
          cache-to: ${{ needs.docker-meta.outputs.push == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.REGISTRY_IMAGE, env.PLATFORM_PAIR) || '' }}

      - name: Export digest
        if: needs.docker-meta.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.docker-meta.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker Merge & Push Manifest

    if: needs.docker-meta.outputs.push == 'true'

    runs-on: ubuntu-latest

    needs:
      - docker-meta
      - docker

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: clarkperkins
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ needs.docker-meta.outputs.json }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          VERSION: ${{ needs.docker-meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

  helm:
    name: Helm Chart

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: List changed charts
        run: ct list-changed --target-branch ${{ github.event.repository.default_branch }}

      - name: Lint charts
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Configure Git
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        if: github.ref_name == github.event.repository.default_branch
        uses: helm/chart-releaser-action@v1
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
