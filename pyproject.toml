[project]
name = "saucerbot"
version = "1.0.0"
description = "bot for the saucer groupme"
authors = [
    {name = "Clark Perkins",email = "clarkperkins@users.noreply.github.com"},
    {name = "Chris Reynolds",email = "christianbreynolds@users.noreply.github.com"}
]
readme = "README.rst"
requires-python = ">=3.13,<4.0"
dependencies = [
    "arrow>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "colorlog>=6.12.0",
    "discord.py ~=2.0",
    "dj-database-url>=3.1.2",
    "django ~=6.1.0",
    "django-split-settings>=1.3.2",
    "djangorestframework ~=3.18.0",
    "gunicorn>=26.2.0",
    "lowerpines @ git+https://github.com/bigfootjon/lowerpines.git@main",
    "psycopg>=3.3.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rollbar>=1.5.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
saucerbot = "saucerbot.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "dpytest>=0.7.0",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pylint~=4.1",
    "pylint-django>=2.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.16.0",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]

[tool.uv]
# Relative exclude-newer durations need a recent uv.
required-version = ">=0.12"
# Don't resolve releases younger than this. Renovate applies the same age to
# the PRs it opens, but its lock file maintenance just runs `uv lock --upgrade`,
# so this is what holds back transitive dependencies. Installing from an
# existing lock is unaffected.
exclude-newer = "3 days"

[tool.uv.build-backend]
# Flat layout: the package lives at ./saucerbot, not ./src/saucerbot.
module-root = ""


[tool.black]
exclude = "migrations"
# Pin the target so formatting is identical no matter which interpreter runs
# black. Without it black infers the whole requires-python range and its AST
# safety check fails on anything older than the newest version in that range.
target-version = ["py313"]



[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
]

ignore_errors = true

omit = [
    "saucerbot/*/migrations/*",
    "saucerbot/discord/main.py",
    "saucerbot/discord/overrides.py",
    "saucerbot/settings/environments/*",
]

[tool.coverage.html]
directory = "reports/coverage/html"
title = "saucerbot coverage"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"



[tool.django-stubs]
django_settings_module = "saucerbot.settings"
strict_settings = false



[tool.isort]
profile = "black"
skip_gitignore = true
known_third_party = "discord"



[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
module = "saucerbot.*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "bs4",
    "discord.ext.commands",
    "dj_database_url",
    "rollbar",
]
ignore_missing_imports = true



[tool.pylint.master]
ignore = [
    "CVS",
    "migrations",
]
load-plugins = [
    "pylint_django",
]
django-settings-module = "saucerbot.settings"

[tool.pylint.messages_control]
disable = [
    "invalid-name",
    "missing-docstring",
    "no-else-return",
    "too-few-public-methods",
]

[tool.pylint.import]
known-third-party = [
    "discord",
]

[tool.pylint.design]
# Maximum number of arguments for a function (see R0913). The handler decorator
# takes a set of keyword-only config flags; only the regex is positional.
max-args = 10
# Maximum number of attributes for a class (see R0902).
max-attributes = 15
# Maximum number of parents for a class (see R0901).
max-parents = 15



[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "saucerbot.settings"
testpaths = [
    "tests",
]
